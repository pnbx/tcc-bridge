name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build --no-daemon --stacktrace

      - name: Upload plugin jar
        uses: actions/upload-artifact@v4
        with:
          name: TccBridge
          path: build/libs/*.jar
          if-no-files-found: error

      # Action artifacts live on Azure blob storage, which is unreachable from
      # the deployment network; a release asset is downloadable everywhere.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(ls build/libs/*.jar | head -1)
          gh release create "build-${{ github.run_number }}" "$jar" \
            --title "TccBridge build ${{ github.run_number }}" \
            --notes "Automated build from ${{ github.sha }}"
